<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analyse d'image - Gemini</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 700px;
    margin: 40px auto;
    padding: 20px;
    background: #f5f5f7;
    color: #1d1d1f;
  }
  h1 { font-size: 1.5rem; }
  .card {
    background: white;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  label { display: block; font-weight: 600; margin: 16px 0 6px; }
  input[type="password"], textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #d1d1d6;
    border-radius: 8px;
    font-size: 1rem;
  }
  input[type="file"] {
    width: 100%;
    padding: 10px;
    border: 2px dashed #d1d1d6;
    border-radius: 8px;
    background: #fafafa;
    cursor: pointer;
  }
  button {
    margin-top: 16px;
    padding: 12px 24px;
    background: #0071e3;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { background: #aaa; cursor: not-allowed; }
  button:hover:not(:disabled) { background: #0060c0; }
  #preview {
    max-width: 100%;
    margin-top: 12px;
    border-radius: 8px;
    display: none;
  }
  #result {
    margin-top: 20px;
    padding: 16px;
    background: #f0f7ff;
    border-left: 4px solid #0071e3;
    border-radius: 6px;
    white-space: pre-wrap;
    display: none;
  }
  #status { margin-top: 12px; font-size: 0.9rem; color: #666; }
  .error { color: #c00 !important; }
</style>
</head>
<body>

<h1>🖼️ Analyse d'image avec Gemini</h1>

<div class="card">
  <label for="apiKey">Clé API Google Gemini</label>
  <input type="password" id="apiKey" placeholder="AIza... (aistudio.google.com/apikey)">

  <label for="fileInput">Choisir une image</label>
  <input type="file" id="fileInput" accept="image/*">

  <label for="prompt">Question sur l'image (optionnel)</label>
  <textarea id="prompt" rows="2" placeholder="Décris cette image en détail..."></textarea>

  <button id="sendBtn" disabled>Analyser l'image</button>

  <img id="preview" alt="Aperçu">
  <div id="status"></div>
  <div id="result"></div>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const apiKeyInput = document.getElementById('apiKey');
const promptInput = document.getElementById('prompt');
const sendBtn = document.getElementById('sendBtn');
const preview = document.getElementById('preview');
const result = document.getElementById('result');
const status = document.getElementById('status');

let imageBase64 = null;
let imageMime = null;

// Aperçu de l'image
fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;

  if (file.size > 10 * 1024 * 1024) {
    alert("Image trop volumineuse (max 10 Mo).");
    return;
  }

  imageMime = file.type;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const dataUrl = ev.target.result;
    imageBase64 = dataUrl.split(',')[1];
    preview.src = dataUrl;
    preview.style.display = 'block';
    updateButton();
  };
  reader.readAsDataURL(file);
});

apiKeyInput.addEventListener('input', updateButton);
promptInput.addEventListener('input', updateButton);

function updateButton() {
  sendBtn.disabled = !(imageBase64 && apiKeyInput.value.trim().length > 10);
}

sendBtn.addEventListener('click', async () => {
  sendBtn.disabled = true;
  result.style.display = 'none';
  status.className = '';
  status.textContent = "Envoi à Gemini...";

  const prompt = promptInput.value.trim() || "Décris cette image en détail en français.";

  try {
    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKeyInput.value.trim())}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: prompt },
              { inline_data: { mime_type: imageMime, data: imageBase64 } }
            ]
          }]
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error?.message || `Erreur HTTP ${response.status}`);
    }

    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "(Pas de réponse)";
    result.textContent = text;
    result.style.display = 'block';
    status.textContent = "✅ Analyse terminée.";
  } catch (err) {
    status.className = 'error';
    status.textContent = "❌ Erreur : " + err.message;
    console.error(err);
  } finally {
    sendBtn.disabled = false;
  }
});
</script>

</body>
</html>
